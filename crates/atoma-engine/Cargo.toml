[package]
description = "The executor: one pinned thread per rank, owning a device and acting on the engine's step commands"
edition     = { workspace = true }
license     = "Apache-2.0"
name        = "atoma-engine"
version     = { workspace = true }

[dependencies]
atoma-core      = { workspace = true }
atoma-kernels   = { workspace = true }
atoma-models    = { workspace = true }
atoma-runtime   = { workspace = true }
candle-core     = { workspace = true }
candle-nn       = { workspace = true, optional = true }
core_affinity   = { workspace = true }
crossbeam-utils = { workspace = true }
cudarc          = { workspace = true }
flume           = { workspace = true }
hf-hub          = { workspace = true }
models          = { workspace = true, optional = true }
rtrb            = { workspace = true }
serde           = { workspace = true, features = [ "derive" ] }
serde_json      = { workspace = true }
thiserror       = { workspace = true }
tracing         = { workspace = true }
validator       = { workspace = true, features = [ "derive" ] }

[features]
cuda = [
    "atoma-kernels/cuda",
    "atoma-models/cuda",
    "candle-core/cuda",
    "candle-nn/cuda",
    "dep:candle-nn",
    "dep:models",
    "models/cuda",
]
nccl = [ "atoma-runtime/nccl", "cuda", "cudarc/nccl", "models/nccl" ]
# What a gate needs that a serving build must not have: nothing enables it but the gate scripts.
test-support = [ "atoma-models/test-support" ]

[dev-dependencies]
atoma-runtime = { workspace = true, features = [ "test-support" ] }
figment       = { workspace = true, features = [ "toml" ] }
parking_lot   = { workspace = true }
tempfile      = { workspace = true }

[lints.clippy]
await_holding_lock      = "deny"
dbg_macro               = "deny"
exit                    = "deny"
large_futures           = "deny"
mem_forget              = "deny"
module_name_repetitions = "allow"
panic_in_result_fn      = "deny"
pedantic                = { level = "warn", priority = -1 }
print_stderr            = "deny"
print_stdout            = "deny"
similar_names           = "allow"
todo                    = "warn"
unimplemented           = "deny"
